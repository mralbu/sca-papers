<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCA Papers Explorer</title>
  <meta name="description" content="Interactive map of the Society of Core Analysts symposium papers (1987–2026), clustered by topic and sized by in-corpus citations.">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.1.14/dist.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/minisearch@7.2.0/dist/umd/index.js" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha256-cXvJrnhTth8PdkVd3fDs1PUnp4P0LeKsJGhImcHEYlg=" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha256-5r/l3uvUx8zScgVbq2O9OrLHO5B7bmoi01J0CoE4H9Q=" crossorigin="anonymous" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="bar">
    <h1>SCA Papers Explorer</h1>
    <nav class="views" role="tablist" aria-label="View">
      <button role="tab" data-view="list" aria-selected="true">List</button>
      <button role="tab" data-view="map" aria-selected="false">Map</button>
    </nav>
    <span id="count" class="muted"></span>
    <a class="muted" href="https://www.jgmaas.com/SCA/" target="_blank" rel="noopener">papers on jgmaas.com</a>
  </header>

  <aside id="controls" class="panel">
    <label class="field">
      <span>Search</span>
      <input id="search" type="search" placeholder="title, author, keyword, ID…" autocomplete="off">
    </label>
    <ol id="results" class="results map-only"></ol>

    <div class="field">
      <span>Years <button id="years-reset" class="link push" type="button" hidden>reset</button></span>
      <div class="years">
        <input id="year-min" type="number" inputmode="numeric" aria-label="First year">
        <span class="muted">to</span>
        <input id="year-max" type="number" inputmode="numeric" aria-label="Last year">
      </div>
    </div>

    <label class="field map-only">
      <span>Point size</span>
      <select id="size-by">
        <option value="pagerank">PageRank (citation graph)</option>
        <option value="cited_by">Times cited (in corpus)</option>
        <option value="uniform">Uniform</option>
      </select>
    </label>

    <div class="field">
      <span>Topics <span id="topics-n" class="n-head"></span>
        <button id="topics-all" class="link push" type="button">all</button>
        <span class="sep" aria-hidden="true">·</span>
        <button id="topics-none" class="link" type="button">none</button>
      </span>
      <ul id="topics" class="topics"></ul>
    </div>
  </aside>
  <div class="resizer" data-side="left" title="Drag to resize, double-click to reset"></div>

  <main id="main">
    <section id="list-view" class="view" aria-label="List of papers">
      <div class="list-bar">
        <span id="list-count" class="muted"></span>
        <label>Sort
          <select id="sort">
            <option value="relevance" disabled>Best match</option>
            <option value="newest" selected>Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="cited">Most cited</option>
            <option value="pagerank">PageRank</option>
          </select>
        </label>
      </div>
      <ol id="list" class="feed"></ol>
      <div id="list-more" class="muted list-more"></div>
    </section>
    <section id="map-view" class="view" aria-label="Map of papers" hidden>
      <div id="map"></div>
    </section>
  </main>
  <div id="tooltip" class="tooltip" hidden></div>

  <aside id="detail" class="panel detail" hidden aria-labelledby="d-title">
    <div class="resizer" data-side="right" title="Drag to resize, double-click to reset"></div>
    <div class="d-bar">
      <p class="meta"><span id="d-id"></span> · <span id="d-year"></span></p>
      <button id="wide" class="icon" type="button" aria-pressed="false" title="Reading mode (R)">⤢</button>
      <button id="close" class="icon" type="button" aria-label="Close" title="Close (Esc)">×</button>
    </div>
    <article class="d-body">
      <button id="d-topic" class="chip" type="button" title="Show only this topic"></button>
      <h2 id="d-title"></h2>
      <p id="d-authors" class="authors"></p>
      <p id="d-filled" class="filled" hidden></p>
      <div class="d-actions">
        <a id="d-pdf" class="btn primary" target="_blank" rel="noopener">Read PDF ↗</a>
        <button id="d-map" class="btn" type="button" title="Switch to the map and zoom to this paper (M)">Show on map</button>
        <button id="d-copy" class="btn" type="button">Copy link</button>
      </div>
      <dl class="stats">
        <div><dt>Cited by</dt><dd id="d-cited-n"></dd></div>
        <div><dt>Cites</dt><dd id="d-cites-n"></dd></div>
        <div><dt>PageRank</dt><dd id="d-rank"></dd></div>
      </dl>
      <section id="d-summary-wrap" hidden>
        <h3>Summary <span class="ai-tag" title="Written by Claude (Sonnet 5.5) from the paper's text. It can contain errors: check the PDF.">AI-generated</span></h3>
        <p id="d-tldr" class="tldr"></p>
        <p id="d-summary" class="abstract"></p>
        <div id="d-keywords" class="keywords"></div>
      </section>
      <section id="d-abstract-wrap">
        <h3>Abstract</h3>
        <p id="d-abstract" class="abstract"></p>
      </section>
      <figure id="d-figure" hidden>
        <img id="d-img" alt="" loading="lazy">
        <figcaption id="d-caption"></figcaption>
        <p id="d-fig-reason" class="fig-reason" hidden></p>
      </figure>
      <section class="related">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="similar" aria-selected="true">Similar <span id="n-similar"></span></button>
          <button role="tab" data-tab="cited">Cited by <span id="n-cited"></span></button>
          <button role="tab" data-tab="cites">Cites <span id="n-cites"></span></button>
        </div>
        <ul id="d-related" class="cards"></ul>
        <p id="d-related-empty" class="muted" hidden></p>
      </section>
    </article>
  </aside>
</body>
</html>
