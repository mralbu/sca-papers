<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCA Papers Explorer</title>
  <meta name="description" content="Interactive map of the Society of Core Analysts symposium papers (1987–2026), clustered by topic and sized by in-corpus citations.">
  <script>
    // Apply a saved light/dark choice before first paint (no flash); otherwise follow the system.
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/deck.gl@9.1.14/dist.min.js" integrity="sha256-BZs9dCF93d5VJUgojI/H2++LbrcE6UXIPnZ2mC4PCAM=" crossorigin="anonymous" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/minisearch@7.2.0/dist/umd/index.js" integrity="sha256-A8J5MetgOvHTNYV56Yher9tqL1+pkpVXs+d9fpnQbQM=" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha256-cXvJrnhTth8PdkVd3fDs1PUnp4P0LeKsJGhImcHEYlg=" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha256-5r/l3uvUx8zScgVbq2O9OrLHO5B7bmoi01J0CoE4H9Q=" crossorigin="anonymous" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="bar">
    <h1>SCA Papers Explorer</h1>
    <nav class="views" role="tablist" aria-label="View">
      <button role="tab" data-view="list" aria-selected="true">List</button>
      <button role="tab" data-view="map" aria-selected="false">Map</button>
    </nav>
    <span id="count" class="muted"></span>
    <nav class="links" aria-label="Site">
      <a class="src" href="https://www.jgmaas.com/SCA/" target="_blank" rel="noopener">papers on jgmaas.com</a>
      <a class="gh" href="https://github.com/mralbu/sca-papers" target="_blank" rel="noopener" aria-label="Source on GitHub" title="Source on GitHub"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></a>
      <a class="about-link" href="about.html" title="About this site, how it was built"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>About</span></a>
    </nav>
    <button id="theme" class="theme" type="button" role="switch" aria-label="Dark theme">
      <span class="knob" aria-hidden="true"></span>
      <!-- Sun and moon outlines from Lucide (ISC licence), drawn in currentColor. -->
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span>
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
    </button>
  </header>

  <aside id="controls" class="panel">
    <label class="field">
      <span>Search</span>
      <input id="search" type="search" placeholder="title, author, keyword, ID…" autocomplete="off">
    </label>
    <ol id="results" class="results map-only"></ol>

    <div class="field">
      <span>Years <button id="years-reset" class="link push" type="button" hidden>reset</button></span>
      <div class="years">
        <input id="year-min" type="number" inputmode="numeric" aria-label="First year">
        <span class="muted">to</span>
        <input id="year-max" type="number" inputmode="numeric" aria-label="Last year">
      </div>
    </div>

    <label class="field">
      <span>Method</span>
      <select id="method" title="Main approach, AI-assigned from the paper's text">
        <option value="">All methods</option>
      </select>
    </label>

    <div class="field">
      <span>Topics <span id="topics-n" class="n-head"></span>
        <button id="topics-all" class="link push" type="button">all</button>
        <span class="sep" aria-hidden="true">·</span>
        <button id="topics-none" class="link" type="button">none</button>
      </span>
      <ul id="topics" class="topics"></ul>
    </div>
  </aside>
  <div class="resizer" data-side="left" title="Drag to resize, double-click to reset"></div>

  <main id="main">
    <section id="list-view" class="view" aria-label="List of papers">
      <div class="list-bar">
        <span id="list-count" class="muted"></span>
        <label>Sort
          <select id="sort">
            <option value="relevance" disabled>Best match</option>
            <option value="newest" selected>Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="cited">Most cited</option>
            <option value="pagerank">PageRank</option>
          </select>
        </label>
      </div>
      <ol id="list" class="feed"></ol>
      <div id="list-more" class="muted list-more"></div>
    </section>
    <section id="map-view" class="view" aria-label="Map of papers" hidden>
      <div id="map"></div>
    </section>
  </main>
  <div id="tooltip" class="tooltip" hidden></div>

  <aside id="detail" class="panel detail" hidden aria-labelledby="d-title">
    <div class="resizer" data-side="right" title="Drag to resize, double-click to reset"></div>
    <div class="d-bar">
      <p class="meta"><span id="d-id"></span> · <span id="d-year"></span></p>
      <button id="wide" class="icon" type="button" aria-pressed="false" title="Reading mode (R)">⤢</button>
      <button id="close" class="icon" type="button" aria-label="Close" title="Close (Esc)">×</button>
    </div>
    <article class="d-body">
      <button id="d-topic" class="chip" type="button" title="Show only this topic"></button>
      <h2 id="d-title"></h2>
      <p id="d-authors" class="authors"></p>
      <p id="d-filled" class="filled" hidden></p>
      <div class="d-actions">
        <a id="d-pdf" class="btn primary" target="_blank" rel="noopener">Read PDF ↗</a>
        <button id="d-map" class="btn" type="button" title="Switch to the map and zoom to this paper (M)">Show on map</button>
        <button id="d-copy" class="btn" type="button">Copy link</button>
      </div>
      <dl class="stats">
        <div><dt>Cited by</dt><dd id="d-cited-n"></dd></div>
        <div><dt>Cites</dt><dd id="d-cites-n"></dd></div>
        <div><dt>PageRank</dt><dd id="d-rank"></dd></div>
      </dl>
      <section id="d-summary-wrap" hidden>
        <h3>Summary <span class="ai-tag" title="Written by a large language model from the paper's text. It can contain errors: check the PDF.">AI-generated</span></h3>
        <p id="d-tldr" class="tldr"></p>
        <p id="d-summary" class="abstract"></p>
        <div id="d-keywords" class="keywords"></div>
      </section>
      <section id="d-abstract-wrap">
        <h3>Abstract</h3>
        <p id="d-abstract" class="abstract"></p>
      </section>
      <figure id="d-figure" hidden>
        <img id="d-img" alt="" loading="lazy">
        <figcaption id="d-caption"></figcaption>
        <p id="d-fig-reason" class="fig-reason" hidden></p>
      </figure>
      <section class="related">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="similar" aria-selected="true">Similar <span id="n-similar"></span></button>
          <button role="tab" data-tab="cited">Cited by <span id="n-cited"></span></button>
          <button role="tab" data-tab="cites">Cites <span id="n-cites"></span></button>
        </div>
        <ul id="d-related" class="cards"></ul>
        <p id="d-related-empty" class="muted" hidden></p>
      </section>
    </article>
  </aside>
</body>
</html>
